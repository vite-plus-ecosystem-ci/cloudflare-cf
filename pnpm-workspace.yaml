packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (the pinned pkg.pr.new Forge build) are allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
